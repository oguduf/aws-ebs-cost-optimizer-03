name: Python EBS Cost Optimizer CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Security analysis
        run: bandit -q -r src
      - name: Unit tests
        run: pytest -v
      - name: Coverage
        run: pytest --cov=ebs_optimizer --cov-report=term-missing --cov-fail-under=85
      - name: Offline CLI integration
        run: |
          python -m ebs_optimizer.cli --fixture examples/sample_organization.json --min-age-days 30 --output-dir reports/ci --generate-deletion-plan
          test -s reports/ci/ebs-cost-report.csv
          test -s reports/ci/ebs-cost-report.json
          test -s reports/ci/ebs-cost-report.md
          test -s reports/ci/ebs-deletion-review-plan.json

